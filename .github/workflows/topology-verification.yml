name: manual topology verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    name: Production topology smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test:topology
      - name: Replay computer tools against real Chromium without inference
        run: bun run test:computer-replay --image=rakazo/computer:topology
